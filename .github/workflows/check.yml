name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc resolves the kit's types from its build output.
      - run: npm run build:ui-kit
      - run: npm run check

  # Known vulnerabilities in the dependencies. Dependabot proposes the updates;
  # this fails the build until a high one is fixed.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: ui-kit
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo audit --file team-server/Cargo.lock
