[package]
name = "team-wire"
version = "0.1.0"
description = "The encrypted link between the Octopus Agent launcher and its team server, shared by both."
authors = ["Harindu Jayakody"]
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# TLS 1.3 on ring only: the launcher's tree already builds both, and no second
# crypto backend comes in with them.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
